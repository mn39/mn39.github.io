<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock - MOON JIHWAN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    canvas { display: block; }
    .back {
      position: fixed; top: 1.5rem; left: 1.5rem;
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-family: 'Segoe UI', sans-serif; font-size: 0.9rem;
      font-weight: 600; letter-spacing: 0.1em;
      transition: color 0.3s;
      z-index: 10;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <a href="../../" class="back">&larr; BACK</a>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let size;
    function resize() {
      size = Math.min(window.innerWidth, window.innerHeight) * 0.7;
      canvas.width = size;
      canvas.height = size;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
      const cx = size / 2;
      const cy = size / 2;
      const r = size * 0.42;
      const now = new Date();

      ctx.clearRect(0, 0, size, size);

      // Face
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Hour markers
      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI) / 6 - Math.PI / 2;
        const inner = i % 3 === 0 ? r * 0.82 : r * 0.88;
        const outer = r * 0.95;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
        ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
        ctx.strokeStyle = i % 3 === 0 ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = i % 3 === 0 ? 3 : 1.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      const sec = now.getSeconds() + now.getMilliseconds() / 1000;
      const min = now.getMinutes() + sec / 60;
      const hr = (now.getHours() % 12) + min / 60;

      // Hour hand
      drawHand(cx, cy, (hr * Math.PI) / 6 - Math.PI / 2, r * 0.5, 4, 'rgba(255,255,255,0.8)');

      // Minute hand
      drawHand(cx, cy, (min * Math.PI) / 30 - Math.PI / 2, r * 0.7, 2.5, 'rgba(255,255,255,0.6)');

      // Second hand
      drawHand(cx, cy, (sec * Math.PI) / 30 - Math.PI / 2, r * 0.82, 1, 'rgba(100, 180, 255, 0.7)');

      // Center dot
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(100, 180, 255, 0.8)';
      ctx.fill();

      requestAnimationFrame(draw);
    }

    function drawHand(cx, cy, angle, length, width, color) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    draw();
  </script>
</body>
</html>
